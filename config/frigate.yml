mqtt:
  host: mqtt
  port: 1883
  topic_prefix: frigate
  client_id: frigate

detectors:
  cpu1:
    type: cpu

objects:
  track:
    - person
    - car
    - dog
    - cat

record:
  enabled: true
  alerts:
    retain:
      days: 2
  detections:
    retain:
      days: 2
snapshots:
  enabled: true
  retain:
    default: 2

cameras:
  tplink_exterior:
    ffmpeg:
      inputs:
        - path: rtsp://Licass:Licassss5151@192.168.1.65:554/stream1
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1920
      height: 1080
    zones:
      all:
        coordinates: 0,0,1920,0,1920,1080,0,1080
    snapshots:
      enabled: true
      timestamp: true
      bounding_box: true

  lsc_rotativa:
    ffmpeg:
      inputs:
        - path: rtsp://go2rtc:8554/lsc_rotativa
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1920
      height: 1080
    zones:
      all:
        coordinates: 0,0,1920,0,1920,1080,0,1080
    snapshots:
      enabled: true
      timestamp: true
      bounding_box: true
version: 0.17-0
