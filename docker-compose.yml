services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: localdvr-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    privileged: true
    restart: unless-stopped
    shm_size: "64mb" # Update for higher resolution cameras
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128 # For hardware acceleration (Intel)
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/frigate.yml:/config/config.yml
      - ./media/frigate:/media/frigate
      - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "5050:5000"
      - "8556:8554" # RTSP feeds (alterado para evitar conflito com go2rtc externo)
      - "8557:8555/tcp" # WebRTC over tcp
      - "8557:8555/udp" # WebRTC over udp
    depends_on:
      - mqtt

  recorder:
    build: .
    container_name: localdvr-recorder
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MQTT_HOST=mqtt
      - FRIGATE_URL=http://frigate:5000
    env_file:
      - .env
    volumes:
      - temp_data:/app/temp
    depends_on:
      - mqtt

  tailscale:
    image: tailscale/tailscale:latest
    container_name: localdvr-tailscale
    restart: unless-stopped
    hostname: localdvr-server
    ports:
      - "443:443"
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw
    command: >
      /bin/sh -c "tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock & 
      sleep 5 && 
      tailscale up --authkey=$${TS_AUTHKEY} --reset --hostname=localdvr-server && 
      tailscale serve --https=443 http://caddy:80 && 
      tail -f /dev/null"

  caddy:
    image: caddy:latest
    container_name: localdvr-caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - recorder
      - tailscale

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    restart: unless-stopped
    ports:
      - "1984:1984"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    volumes:
      - ./config/go2rtc.yaml:/config/go2rtc.yaml

  viewer:
    image: node:20-slim
    container_name: localdvr-viewer
    working_dir: /app
    volumes:
      - ./viewer:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - recorder

volumes:
  temp_data:
  tailscale_data:
  caddy_data:
